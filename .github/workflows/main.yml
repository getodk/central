name: Test, Build, Publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Publish images to registry?'
        required: true
        type: boolean
        default: false

jobs:
  test-misc: # quick, simple checks
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    steps:
    - run: docker --version
    - run: docker compose version
    - uses: actions/checkout@v5
    - run: sudo apt-get install shellcheck
    - run: ./test/check-scripts.sh
  test-service:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
    - run: touch .env
    - run: docker compose pull --include-deps service
    - uses: actions/setup-node@v5
      with:
        node-version-file: test/package.json
    - run: cd test && npm clean-install --no-audit
    - run: touch ./files/allow-postgres14-upgrade
    - run: cd test && npm run test:service:db-backup-restore
