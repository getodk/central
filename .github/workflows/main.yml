name: Test, Build, Publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Publish images to registry?'
        required: true
        type: boolean
        default: false

jobs:
  test-images:
    timeout-minutes: 10
    runs-on: ubuntu-24.04 # TODO matrix to run on all expected versions?
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: recursive
    - uses: ./.github/actions/relegate-azure-mirrors

    - run: ./test/check-docker-context.sh --min-size 5000 --max-size 10000 --min-count 650 --max-count 750

    - run: ./files/ci/extract-frontend-version.sh
    - run: FRONTEND_BUILD_MODE=fetch ./test/test-images.sh

    # Check out the current frontend version referenced by docker-compose, as it should build OK.
    - run: |
           git clone \
               --depth 1 \
               --branch "$FRONTEND_VERSION" \
               https://github.com/getodk/central-frontend.git \
               client
    - run: FRONTEND_BUILD_MODE=source ./test/test-images.sh

    - if: always()
      run: docker compose logs
  build-push-image:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.publish_images == true) ||
      (github.event_name != 'workflow_dispatch' && (
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      ))
    needs:
    - test-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [nginx, service]
    env:
      REGISTRY: ghcr.io
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: recursive
    - uses: ./.github/actions/relegate-azure-mirrors
    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Show Docker Context
      run: ./test/check-docker-context.sh --report

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/central-${{ matrix.image }}

    - name: Set up QEMU emulator for multi-arch images
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - run: ./files/ci/extract-frontend-version.sh

    - name: Build and push ${{ matrix.image }} Docker image
      uses: docker/build-push-action@v7
      with:
        file: ${{ matrix.image }}.dockerfile
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: 'linux/amd64,linux/arm64'
        build-args: |
          FRONTEND_BUILD_MODE=fetch
          FRONTEND_VERSION=${{ env.FRONTEND_VERSION }}
