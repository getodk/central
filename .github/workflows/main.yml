name: Test, Build, Publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Publish images to registry?'
        required: true
        type: boolean
        default: false

jobs:
  test-misc: # quick, simple checks
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    steps:
    - run: docker --version
    - run: docker compose version
    - uses: actions/checkout@v5
    - run: ./test/check-submodules.sh
    - run: ./test/test-with-pgenvblock.sh
    - run: sudo apt-get install shellcheck
    - run: ./test/check-scripts.sh
    - run: ./test/check-for-large-files.sh
    - run: ./test/check-dockerfiles.sh
    - run: cd test && npm clean-install --no-audit
    - run: cd test && npm run lint
    - run: cd test && npm run test:github-actions
  test-images:
    timeout-minutes: 10
    runs-on: ubuntu-24.04 # TODO matrix to run on all expected versions?
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: recursive

    - run: ./test/check-docker-context.sh --min-size 5000 --max-size 10000 --min-count 650 --max-count 750

    - run: ./files/ci/extract-frontend-version.sh
    - run: FRONTEND_BUILD_MODE=fetch ./test/test-images.sh

    # Check out the current frontend version referenced by docker-compose, as it should build OK.
    - run: |
           git clone \
               --depth 1 \
               --branch "$FRONTEND_VERSION" \
               https://github.com/getodk/central-frontend.git \
               client
    - run: FRONTEND_BUILD_MODE=source ./test/test-images.sh

    - if: always()
      run: docker compose logs
