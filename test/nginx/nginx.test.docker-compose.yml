services:
  enketo:
    build:
      dockerfile: mock-http-service.dockerfile
    ports:
      - 127.0.0.1:8005:8005
    environment:
      - PORT=8005
  service:
    build:
      dockerfile: mock-http-service.dockerfile
    ports:
      - 127.0.0.1:8383:8383
    environment:
      - PORT=8383
  sentry-mock:
    build:
      dockerfile: mock-sentry.dockerfile
    ports:
      # Sentry port is not currently configurable in nginx config, so use default HTTPS port
      # FIXME in line with other .ports, make this port binding more restrictive
      - "443:443"
    environment:
      - MODE=https
      - HTTPS_HOST=o-fake-dsn.ingest.sentry.io
      - PORT=443
  nginx-ssl-selfsign:
    extends:
      file: lib.docker-compose.yml
      service: nginx
    environment:
      - SSL_TYPE=selfsign
    ports:
      - "127.0.0.1:9000:80"
      - "[::1]:9000:80"
      - "127.0.0.1:9001:443"
      - "[::1]:9001:443"
  nginx-ssl-upstream:
    extends:
      file: lib.docker-compose.yml
      service: nginx
    environment:
      - SSL_TYPE=upstream
    ports:
      - "127.0.0.1:10000:80"
      - "[::1]:10000:80"
      - "127.0.0.1:10001:443"
      - "[::1]:10001:443"
  nginx-test-setup-odk:
    extends:
      file: lib.docker-compose.yml
      service: nginx
    environment:
      SSL_TYPE: ${SSL_TYPE}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./src/certs/nginx.pem:/etc/dh/nginx.pem:ro
      - ./src/certs/privkey.pem:/etc/selfsign/live/odk-nginx.example.test/privkey.pem:ro
      - ./src/certs/fullchain.pem:/etc/selfsign/live/odk-nginx.example.test/fullchain.pem:ro
      - ./src/certs/nginx.default.key:/etc/nginx/ssl/nginx.default.key:ro
      - ./src/certs/nginx.default.crt:/etc/nginx/ssl/nginx.default.crt:ro
